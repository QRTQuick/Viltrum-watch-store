<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D14" />
      <stop offset="50%" stop-color="#121824" />
      <stop offset="100%" stop-color="#07080A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="30%" stop-color="#E5B94E" />
      <stop offset="70%" stop-color="#C9A24D" />
      <stop offset="100%" stop-color="#8F6B23" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="50%" stop-color="#E61E2A" />
      <stop offset="100%" stop-color="#990B14" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4" />

  <!-- Outer Watch Bezel / Fluted Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="256" cy="256" r="170" fill="#0C101A" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />

  <!-- Dial Hour Markers -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="95" x2="256" y2="115" />
    <line x1="256" y1="397" x2="256" y2="417" />
    <line x1="95" y1="256" x2="115" y2="256" />
    <line x1="397" y1="256" x2="417" y2="256" />
    
    <line x1="142" y1="142" x2="156" y2="156" opacity="0.6" />
    <line x1="370" y1="142" x2="356" y2="156" opacity="0.6" />
    <line x1="142" y1="370" x2="156" y2="356" opacity="0.6" />
    <line x1="370" y1="370" x2="356" y2="356" opacity="0.6" />
  </g>

  <!-- Quick Red Tech Ruby Indicator / Logo Accent -->
  <circle cx="256" cy="138" r="7" fill="url(#redGrad)" filter="url(#goldGlow)" />
  <polygon points="256,126 262,138 256,150 250,138" fill="url(#redGrad)" />

  <!-- Central Stylized 'V' Monogram (Viltrum) -->
  <path d="M 170 185 L 235 340 L 256 385 L 277 340 L 342 185 L 305 185 L 256 310 L 207 185 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  
  <!-- Precision Tourbillon / Hands Center Core -->
  <circle cx="256" cy="256" r="14" fill="#121824" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="256" cy="256" r="6" fill="url(#redGrad)" />

  <!-- Watch Hands -->
  <line x1="256" y1="256" x2="330" y2="210" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="256" x2="210" y2="180" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="270" x2="256" y2="160" stroke="url(#redGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bottom Brand Text Monogram -->
  <text x="256" y="445" font-family="'Cinzel', 'Playfair Display', serif, sans-serif" font-size="24" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">VILTRUM</text>
  <text x="256" y="470" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FF4D4D" text-anchor="middle" letter-spacing="3">BY QUICK RED TECH</text>
</svg>
